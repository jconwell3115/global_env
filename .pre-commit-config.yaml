---
repos:
  - repo: local
    hooks:
      - id: black
        name: Black
        entry: black
        language: system
        files: \.py$
        log_file: logs/black.log

      - id: ruff
        name: Ruff Linter
        entry: ruff check
        description: Fast Python linter and formatter
        stages: [manual]
        log_file: logs/ruff.log
        language: system
        types: [python]

