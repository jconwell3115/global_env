---
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff Linter
        entry: ruff check
        description: Fast Python linter and formatter
        stages: [manual]
        log_file: logs/ruff.log
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff Formatter
        entry: ruff format
        description: Fast Python linter and formatter
        stages: [manual, pre-commit]
        log_file: logs/ruff-format.log
        language: system
        types: [python]

      - id: mypy
        name: Mypy
        entry: mypy
        language: system
        files: \.py$
        log_file: logs/mypy.log

      - id: pylint
        name: Pylint
        entry: pylint
        language: system
        files: \.py$
        log_file: logs/pylint.log

      - id: markdownlint
        name: Markdownlint
        entry: pymarkdown scan
        language: system
        types: [markdown]
        log_file: logs/markdownlint.log

