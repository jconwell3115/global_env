[project]
name = "my-project"
version = "0.1.0"
description = "Example project using UV and pre-commit"
requires-python = ">=3.11,<3.13"

[tool.uv]
# Treat this as a virtual project (dependencies only, not an installable package).
# Without this, UV >=0.4 tries to build and install the project itself as a package.
package = false
index-url = "https://pypi.org/simple"

[tool.ruff]
line-length = 90
target-version = "py312"
exclude = ['cases_update']

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C",   # mccabe complexity
    "C4",  # flake8-comprehensions
    "T10", # flake8-debugger
    "DJ",  # flake8-django
    "EM",  # flake8-errmsg
    "EXE", # flake8-executable
    "FA",  # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT",# flake8-slots
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "INT", # flake8-gettext
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "TRY", # tryceratops
    "AIR", # airflow
    "PERF",# perflint
    "FURB",# refurb
    "LOG", # flake8-logging
    "RUF", # ruff
    "S",   # flake8-bandit
]
ignore = [
    "E501",   # line too long, handled by formatter
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ['pytest_examples']
# Additional robust options:
force-sort-within-sections = true          # Alphabetical within sections
force-single-line = true           # Force all imports to be on separate lines
lines-after-imports = 2                    # Number of blank lines after imports
order-by-type = true                       # Order imports by type (standard, third-party, first-party, local)
case-sensitive = true                      # Case-sensitive sorting
split-on-trailing-comma = true             # Split imports on trailing comma for multi-line
lines-between-types = 1                    # Lines between different import types
known-third-party = []                     # Add common third-party packages if needed (e.g., ['requests', 'django'])

[tool.ruff.format]
quote-style = "double"          # Use double quotes for strings
indent-style = "space"          # Spaces for indentation
line-ending = "auto"            # Auto-detect line endings

[tool.mypy]
# Static type checking for Python
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
plugins = []

[tool.bandit]
# Directory or files to scan
targets = ["src", "app", "tests"]
# Exclude specific directories
exclude = ["venv", ".venv", "migrations"]
# Severity and confidence levels to report
severity = ["LOW", "MEDIUM", "HIGH"]
confidence = ["LOW", "MEDIUM", "HIGH"]
# Output format (can be: txt, json, xml, yaml)
format = "txt"
# Optional: specify tests to skip (e.g., B101 asserts)
skips = ["B101"]
# Optional: enable recursive scanning
recursive = true

[tool.pydocstyle]
convention = "pep257"                   # Base convention (required)
add-select = ["D200", "D205", "D210", "D211", "D214", "D215", "D300", "D301"]   # Ensure proper punctuation and style
add-ignore = ["D203", "D212"]           # Common ignores for flexibility
match = "(?!test_).*\\.py"              # Apply to all Python files except tests
match-dir = "[^\\.].*"                  # Skip hidden directories

[tool.ansible-lint]
skip_list = [
  "var-naming[pattern]",
  "var-naming[no-role-prefix]",
  "run-once[task]",
  "fqcn[keyword]",
]
exclude_paths = [
  "files/",
  "data/",
  "logs/",
  "stub_data/",
  "collections/",
  ".collections/",
  "test/",
  "venv/",
  ".venv/",
  ".git/",
  "ACT/",
  ".github/",
  ".avd_vars",
  "group_vars/",
  "outputs/",
  "outputs.bak/",
  "playbook_examples/",
]

[tool.yamllint]
extends = "default"

[tool.yamllint.rules.line-length]
max = 120
level = "warning"

[tool.djlint]
close_void_tags=true
max_line_length=90
preserve_blank_lines=true
profile="jinja"
use_gitignore=true
include="J004,J018,T001,T002,T003,T027,T028,T032,T034"
