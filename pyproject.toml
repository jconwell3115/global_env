[project]
name = "my-project"
version = "0.1.0"
description = "Example project using UV and pre-commit"
requires-python = ">=3.9,<3.13"

[tool.ruff]
line-length = 90
target-version = "py312"
exclude = ['cases_update']

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C",   # mccabe complexity
    "C4",  # flake8-comprehensions
    "T10", # flake8-debugger
    "DJ",  # flake8-django
    "D",   # flake8-docstrings
    "EM",  # flake8-errmsg
    "EXE", # flake8-executable
    "FA",  # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT",# flake8-slots
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "INT", # flake8-gettext
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "TRY", # tryceratops
    "AIR", # airflow
    "PERF",# perflint
    "FURB",# refurb
    "LOG", # flake8-logging
    "RUF", # ruff
    "S",   # flake8-bandit
]
ignore = [
    "E501",   # line too long, handled by formatter
    "B008",   # do not perform function calls in argument defaults
    "D100",   # missing-module-docstring (handled by pydocstyle)
    "D101",   # missing-class-docstring (handled by pydocstyle)
    "D102",   # missing-function-docstring (handled by pydocstyle)
    "D103",   # missing-docstring-in-public-function (handled by pydocstyle)
    "D104",   # missing-package-docstring (handled by pydocstyle)
    "D105",   # missing-magic-method-docstring (handled by pydocstyle)
    "D107",   # missing-init-docstring (handled by pydocstyle)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ['pytest_examples']
# Additional robust options:
force-sort-within-sections = true          # Alphabetical within sections
force-single-line = true           # Force all imports to be on separate lines
lines-after-imports = 2                    # Number of blank lines after imports
order-by-type = true                       # Order imports by type (standard, third-party, first-party, local)
case-sensitive = true                      # Case-sensitive sorting
split-on-trailing-comma = true             # Split imports on trailing comma for multi-line
lines-between-types = 1                    # Lines between different import types
known-third-party = []                     # Add common third-party packages if needed (e.g., ['requests', 'django'])

[tool.ruff.format]
quote-style = "double"          # Use double quotes for strings
indent-style = "space"          # Spaces for indentation
line-ending = "auto"            # Auto-detect line endings

[tool.mypy]
# Static type checking for Python
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
plugins = []

[tool.bandit]
# Directory or files to scan
targets = ["src", "app", "tests"]
# Exclude specific directories
exclude = ["venv", ".venv", "migrations"]
# Severity and confidence levels to report
severity = ["LOW", "MEDIUM", "HIGH"]
confidence = ["LOW", "MEDIUM", "HIGH"]
# Output format (can be: txt, json, xml, yaml)
format = "txt"
# Optional: specify tests to skip (e.g., B101 asserts)
skips = ["B101"]
# Optional: enable recursive scanning
recursive = true

[tool.pydocstyle]
convention = "pep257"
match = "(?!test_).*\\.py"
match-dir = "[^\\.].*"

[tool.ansible-lint]
# Configure ansible-lint options
# Example: ignore specific rules or directories
skip_list = ["403", "404"]              # Rule IDs to skip
exclude_paths = ["roles/test_role"]     # Paths to exclude
verbosity = 1                           # 0 = quiet, 1 = normal, 2 = verbose

[tool.yamllint]
# YAML linting configuration
# You can reference a config file or inline rules
# config_file = ".yamllint.yml"           # External config file
# OR inline rules:
rules = {line-length = { max = 120 }, indentation = { spaces = 2 }}

[tool.djlint]
close_void_tags=true
max_line_length=90
preserve_blank_lines=true
profile="jinja"
use_gitignore=true
include="J004,J018,T001,T002,T003,T027,T028,T032,T034"
